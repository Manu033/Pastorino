}

<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2937}
#map{position:absolute;inset:0}
.leaflet-heatmap-layer{pointer-events:none}
#panel{position:absolute;z-index:1000;top:10px;left:56px;width:300px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.25);padding:12px 14px;font-size:13px}
#panel h1{font-size:15px;margin:0 0 8px}
#panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;margin:12px 0 4px}
#panel label{display:block;margin:3px 0;cursor:pointer}
.seg{display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:6px 4px;border-right:1px solid #d1d5db}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg label:has(input:checked){background:#1f2937;color:#fff}
.stat{display:flex;justify-content:space-between;margin:2px 0}
.stat b{font-variant-numeric:tabular-nums}
#bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:6px 0}
#bar i{display:block;height:100%;width:0;background:#2563eb;transition:width .2s}
#msg{color:#6b7280;font-size:12px}
button{font:inherit;padding:5px 9px;border:1px solid #d1d5db;background:#f9fafb;border-radius:6px;cursor:pointer;margin:3px 3px 0 0}
button:hover{background:#f3f4f6}
details{margin-top:8px} summary{cursor:pointer;color:#374151}
#unloc{max-height:180px;overflow:auto;font-size:12px;margin-top:4px}
#unloc div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f3f4f6;padding:2px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cnt{background:none;border:0;box-shadow:none;color:#111;font-weight:700;font-size:11px;text-align:center;line-height:16px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.small{font-size:11px;color:#6b7280}
.pop b{display:block;margin-bottom:2px}
#card{position:absolute;z-index:1000;top:10px;right:10px;width:330px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.25);padding:14px;font-size:13px;display:none}
#card h3{font-size:15px;margin:0 28px 2px 0;line-height:1.25}
#card .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:#6b7280;margin:0;padding:2px 6px}
#card .kp{display:flex;gap:8px;margin:10px 0}
#card .kp div{flex:1;border-radius:8px;padding:8px;text-align:center;background:#f3f4f6}
#card .kp b{display:block;font-size:20px}
#card table{width:100%;border-collapse:collapse;margin-top:4px}
#card th{font-size:11px;color:#6b7280;text-align:right;font-weight:600} #card th:first-child{text-align:left}
#card td{padding:4px 0;border-top:1px solid #f3f4f6;text-align:right;font-variant-numeric:tabular-nums} #card td:first-child{text-align:left;padding-right:8px}
#card a{color:#2563eb}
@media(max-width:640px){#card{top:auto;bottom:10px;left:10px;width:auto;max-height:45%}}
@media(max-width:640px){#panel{left:10px;width:calc(100% - 20px);top:auto;bottom:10px;max-height:45%}}
</style></head><body>
<div id="map"></div>
<div id="card"></div>
<div id="panel">
  <h1>🧯 Matafuegos – últimos 2 años</h1>
  <h2>Mostrar</h2>
  <div class="seg">
    <label><input type="radio" name="f" value="ambas" checked>Ambas</label>
    <label><input type="radio" name="f" value="rec">Recargas</label>
    <label><input type="radio" name="f" value="com">Compras</label>
  </div>
  <label style="margin-top:8px"><input type="checkbox" id="cHeat" checked> Mapa de calor</label>
  <label><input type="checkbox" id="cPts" checked> Puntos</label>
  <label><input type="checkbox" id="cNum" checked> Cantidades sobre los puntos</label>
  <h2>Radio del calor: <span id="rv">20</span></h2>
  <input type="range" id="rad" min="8" max="50" value="20" style="width:100%">
  <h2>Resumen</h2>
  <div class="stat"><span>Matafuegos en pantalla</span><b id="sTot">–</b></div>
  <div class="stat"><span><span class="dot" style="background:#2563eb"></span>Recargas</span><b id="sRec">–</b></div>
  <div class="stat"><span><span class="dot" style="background:#ea580c"></span>Compras</span><b id="sCom">–</b></div>
  <div class="stat"><span>Ubicaciones en pantalla</span><b id="sLoc">–</b></div>
  <div class="small" id="sCov"></div>

  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return (j.resultados || []).map(x => {
    const u = x && x.direcciones && x.direcciones[0] && x.direcciones[0].ubicacion;
    return (u && u.lat != null && u.lon != null) ? [u.lat, u.lon] : null;
  });
}
async function geocodePass(items, depto, nameOnly, accept, label) {
  const CH = 50; let done = 0;
  for (let i = 0; i < items.length; i += CH) {
    const part = items.slice(i, i + CH);
    let res;
    try { res = await batch(part, depto, nameOnly); }
    catch (e) { await new Promise(r => setTimeout(r, 1500)); try { res = await batch(part, depto, nameOnly); } catch (e2) { res = []; $('msg').textContent = 'Error de red con la API de Georef: ' + e2.message; } }
    part.forEach((d, k) => { const p = res[k]; if (p && accept(p)) cache[d.a] = p; });
    done += part.length; saveCache();
    $('bar').firstChild.style.width = Math.round(100 * done / items.length) + '%';
    $('msg').textContent = `${label}: ${done}/${items.length}`;
    render(false);
  }
}
async function geocodeAll() {
  const pending = () => DATA.filter(d => d.q && !cache[d.a]);
  let todo = pending();
  if (!todo.length) { const ok = DATA.filter(d => cache[d.a]).length; $('msg').textContent = `${ok} de ${DATA.length} ubicaciones con coordenadas (del CSV).`; render(false); return; }
  await geocodePass(todo, 'Capital', false, p => inBox(p, CBA), 'Capital (calle + número)');
  todo = pending();
  if (todo.length) await geocodePass(todo, null, false, p => inBox(p, PROV), 'Resto de Córdoba');
  todo = pending();
  if (todo.length) await geocodePass(todo, 'Capital', true, p => inBox(p, CBA), 'Reintento sin tipo de calle');
  $('bar').firstChild.style.width = '0%';
  const ok = DATA.filter(d => cache[d.a]).length;
  $('msg').textContent = `Listo: ${ok} de ${DATA.length} ubicaciones con coordenadas.`;
  render(false);
}

// ---------- Mapa ----------
const map = L.map('map', {preferCanvas: true}).setView([-31.4167, -64.1833], 12);
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, attribution: 'Tiles © Esri'}).addTo(map);

const canvas = L.canvas({padding: .5});
let heat = null, pts = L.layerGroup().addTo(map), nums = L.layerGroup().addTo(map), shown = [];

const swap = () => $('swap').checked;
const REC = d => swap() ? d.c : d.r, COM = d => swap() ? d.r : d.c;
const filt = () => document.querySelector('input[name=f]:checked').value;
const val = d => { const f = filt(); return f === 'rec' ? REC(d) : f === 'com' ? COM(d) : d.r + d.c; };
const color = d => { const f = filt(); if (f === 'rec') return '#2563eb'; if (f === 'com') return '#ea580c'; return REC(d) && COM(d) ? '#7c3aed' : REC(d) ? '#2563eb' : '#ea580c'; };
const rad = v => Math.min(18, 2.5 + 1.2 * Math.sqrt(v));

function popup(d) {
  const names = d.n.map(x => `${esc(x[0])} <span class="small">(rec ${swap()?x[2]:x[1]} · comp ${swap()?x[1]:x[2]})</span>`).join('<br>');
  return `<div class="pop"><b>${esc(d.a)}</b>Recargas: <b style="display:inline">${REC(d)}</b> · Compras: <b style="display:inline">${COM(d)}</b><hr style="margin:5px 0;border:0;border-top:1px solid #e5e7eb">${names}${d.m ? `<br><span class="small">+ ${d.m} cliente(s) más</span>` : ''}</div>`;
}
let selMarker = null;
function showCard(d, marker) {
  const p = cache[d.a], r = REC(d), c = COM(d);
  const rows = d.n.map(x => `<tr><td>${esc(x[0])}</td><td>${swap() ? x[2] : x[1]}</td><td>${swap() ? x[1] : x[2]}</td></tr>`).join('');
  $('card').innerHTML = `<button class="x" id="cx" title="Cerrar">×</button><h3>${esc(d.a)}</h3>
    <div class="small">${d.n.length} cliente${d.n.length === 1 ? '' : 's'} en esta ubicación</div>
    <div class="kp"><div><b style="color:#2563eb">${r}</b>Recargas</div><div><b style="color:#ea580c">${c}</b>Compras</div><div><b>${r + c}</b>Total</div></div>
    <table><tr><th>Cliente</th><th>Rec.</th><th>Comp.</th></tr>${rows}</table>
    ${d.rv ? '<div class="small" style="color:#b45309">Coordenada a revisar (marcada en el CSV)</div>' : ''}<div style="margin-top:10px"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${p[0]},${p[1]}">Ver en Google Maps</a></div>`;
  $('card').style.display = 'block'; $('card').scrollTop = 0;
  $('cx').onclick = closeCard;
  if (selMarker) selMarker.setStyle({color: '#fff', weight: 1});
  selMarker = marker; marker.setStyle({color: '#111', weight: 3}); marker.bringToFront();
}
function closeCard() { $('card').style.display = 'none'; if (selMarker) { selMarker.setStyle({color: '#fff', weight: 1}); selMarker = null; } }
map.on('click', closeCard);
function labelsFor(zoom) { return zoom <= 11 ? 60 : zoom === 12 ? 30 : zoom === 13 ? 15 : zoom === 14 ? 8 : zoom === 15 ? 4 : 1; }
function drawNums() {
  nums.clearLayers();
  if (!$('cNum').checked) return;
  const thr = labelsFor(map.getZoom());
  shown.forEach(({d, v}) => { if (v >= thr) L.marker(cache[d.a], {interactive: false, icon: L.divIcon({className: 'cnt', html: v, iconSize: [30, 16]})}).addTo(nums); });
}
function render(fit) {
  selMarker = null; pts.clearLayers(); if (heat) { map.removeLayer(heat); heat = null; }
  const located = DATA.filter(d => cache[d.a]);
  shown = located.map(d => ({d, v: val(d)})).filter(x => x.v > 0);
  const vals = shown.map(x => x.v).sort((a, b) => a - b);
  const p95 = vals.length ? vals[Math.floor(vals.length * .95)] : 1;
  if ($('cHeat').checked && shown.length)
    heat = L.heatLayer(shown.map(x => [cache[x.d.a][0], cache[x.d.a][1], x.v]), {radius: +$('rad').value, blur: 20, maxZoom: 14, max: Math.max(20, p95 * 8)}).addTo(map);
  if ($('cPts').checked)
    shown.slice().sort((a, b) => b.v - a.v).forEach(({d, v}) => {
      L.circleMarker(cache[d.a], {renderer: canvas, radius: rad(v), color: '#fff', weight: 1, fillColor: color(d), fillOpacity: .8})
        .bindTooltip(`${esc(d.a)} — ${v}`, {sticky: true}).addTo(pts)
        .on('click', ev => { L.DomEvent.stopPropagation(ev); showCard(d, ev.target); });
    });
  drawNums();
  const sr = shown.reduce((s, x) => s + REC(x.d), 0), sc = shown.reduce((s, x) => s + COM(x.d), 0);
  const f = filt();
  $('sRec').textContent = f === 'com' ? '–' : fmt(sr); $('sCom').textContent = f === 'rec' ? '–' : fmt(sc);
  $('sTot').textContent = fmt(f === 'rec' ? sr : f === 'com' ? sc : sr + sc);
  $('sLoc').textContent = fmt(shown.length); $('sCov').textContent = `${fmt(located.length)} de ${fmt(DATA.length)} ubicaciones tienen coordenadas`;
  // sin coordenadas
  const un = DATA.filter(d => !cache[d.a]).sort((a, b) => (b.r + b.c) - (a.r + a.c));
  $('nU').textContent = fmt(un.length);
  $('unloc').innerHTML = un.map(d => `<div><span>${esc(d.n[0] ? d.n[0][0] + ' – ' : '')}${esc(d.a)}</span><b>${d.r + d.c}</b></div>`).join('');
  if (fit && shown.length) map.fitBounds(L.latLngBounds(shown.filter(x => inBox(cache[x.d.a], CBA)).map(x => cache[x.d.a])).pad(.05));
}
document.querySelectorAll('input[name=f],#cHeat,#cPts,#cNum,#swap').forEach(e => e.addEventListener('change', () => render(false)));
$('rad').addEventListener('input', () => { $('rv').textContent = $('rad').value; render(false); });
map.on('zoomend', drawNums);
$('bAll').onclick = () => render(true);
$('bRe').onclick = () => { cache = {}; seed(); saveCache(); geocodeAll(); };
$('bCsv').onclick = () => {
  const rows = [['direccion', 'lat', 'lon', 'recargas', 'compras', 'clientes']].concat(DATA.map(d => {
    const p = cache[d.a] || ['', '']; return [d.a, p[0], p[1], d.r, d.c, d.n.map(x => x[0]).join(' | ')];
  }));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'})); a.download = 'matafuegos_coordenadas.csv'; a.click();
};
render(false);
geocodeAll().catch(e => { $('msg').textContent = 'Error: ' + e.message; });
</script></body></html>
